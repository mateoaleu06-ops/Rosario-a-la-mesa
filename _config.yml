# =========================================================
#  CONFIGURACIÓN GENERAL DE ROSARIO A LA MESA
#  Completá los datos de abajo. Lo que quede vacío ("") no se muestra.
#  Después de guardar, la web se actualiza sola en 1 o 2 minutos.
# =========================================================

title: "Rosario a la mesa"
lema: "Gastronomía rosarina: dónde comer y qué hay detrás de cada lugar"
description: "Medio gastronómico de Rosario: recomendaciones, historias y protagonistas de la escena gastronómica de la ciudad."

# Redes y contacto (pegá el enlace completo, ej.: "https://www.instagram.com/rosarioalamesa")
youtube: "https://www.youtube.com/@RosarioalaMesa"
instagram: "https://www.instagram.com/rosarioalamesa/"
email: ""

# Datos académicos para el pie de página
materia: "Comunicación Multimedial"
universidad: "UCA Rosario"

# MODO PRUEBA
# true  = muestra la franja de "versión de prueba" y completa con [MARCADORES] los espacios
#         que todavía no tienen contenido (notas, videos, verticales, redes).
# false = ponelo cuando el sitio esté listo: los espacios vacíos se ocultan.
modo_prueba: false

# ---------------------------------------------------------
#  CONFIGURACIÓN TÉCNICA — no hace falta tocar nada de acá para abajo
# ---------------------------------------------------------
url: "https://mateoaleu06-ops.github.io"
baseurl: "/Rosario-a-la-mesa"
lang: es-AR
timezone: America/Argentina/Buenos_Aires
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  notas:
    output: true
    permalink: /notas/:name/

defaults:
  - scope:
      path: ""
      type: notas
    values:
      layout: nota

exclude:
  - LEEME.md
  - PLANTILLA-NOTA.md
  - README.md
